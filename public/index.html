<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b37">
  <title>Tempo 100 Sjekk</title>
  <link rel="icon" href="/icon.svg"><link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
  <header><a class="brand" href="/"><span class="logo">100</span> Tempo Sjekk</a><span class="tag">Norske tilhengere</span></header>
  <main>
    <section class="intro"><h1>Tempo 100-sjekk</h1><p>Er tilhengeren registrert som godkjent?</p></section>
    <section class="card lookup" aria-label="Registreringsoppslag">
      <p id="mode" class="mode">Laster datamodus …</p>
      <form id="lookup"><label for="plate">Hengerens registreringsnummer</label><div class="input-row"><div class="plate-wrap"><span class="country" aria-hidden="true">N</span><input id="plate" name="plate" placeholder="AB 1234" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" required aria-describedby="hint"></div><button id="submit" type="submit" disabled>Sjekk</button></div></form>
      <label class="camera-button" for="camera-photo">Les skilt med kamera</label>
      <input id="camera-photo" class="visually-hidden" type="file" accept="image/*" capture="environment">
      <p id="scan-status" class="small" role="status"></p>
      <div id="scan-candidates" class="examples"></div>
      <div id="demo" hidden><p class="small">Prøv fiktive eksempler:</p><div class="examples"><button type="button" data-plate="DEMO100">Godkjent</button><button type="button" data-plate="DEMO80">Annen kode</button><button type="button" data-plate="DEMOU">Ukjent</button><button type="button" data-plate="DEMOE">Utgått kontrollfrist</button></div></div>
      <p id="error" role="alert" hidden></p>
    </section>
    <section id="result" class="card result" aria-live="polite" aria-atomic="true" hidden></section>
  </main>
  <footer>Registerstatus for hengeren. Bruk kameraet når du står parkert.</footer>
</body>
</html>
