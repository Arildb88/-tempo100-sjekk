name: Flutter mobile

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Generate Flutter Android platform
        working-directory: mobile
        run: |
          flutter create --platforms=android --org no.tempo100 --project-name app --no-pub .
          git restore -- pubspec.yaml pubspec.lock
      - name: Configure platform
        working-directory: mobile
        run: dart tool/setup_platforms.dart
      - name: Install and verify
        working-directory: mobile
        run: |
          flutter pub get
          flutter pub outdated
          flutter analyze
          flutter test
          flutter build apk --debug
      - name: Upload resolved Flutter dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tempo100-pubspec-lock
          path: mobile/pubspec.lock
          if-no-files-found: warn
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: tempo100-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
